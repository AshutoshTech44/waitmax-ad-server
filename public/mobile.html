<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>WaitMax Mobile Companion</title><style>body{font-family:system-ui,sans-serif;background:#090d16;color:#fff;margin:0;padding:16px}.box{max-width:460px;margin:auto;background:#111827;border:1px solid #1f2937;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.coins{background:#facc15;color:#090d16;padding:6px 14px;border-radius:99px;font-weight:800}.ad{position:relative;background:#0f172a;border:1px solid #38bdf8;border-radius:14px;padding:16px;margin-top:16px}.cls{position:absolute;top:10px;right:12px;background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer}.tag{font-size:11px;background:#1e293b;padding:3px 8px;border-radius:6px;color:#93c5fd;font-weight:700}.cta{display:inline-block;margin-top:12px;background:#2563eb;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700}.vault{margin-top:18px;border-top:1px solid #1f2937;padding-top:14px}.vbtn{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#f8fafc;font-weight:600;cursor:pointer}.note{font-size:12px;color:#94a3b8;margin-top:10px}</style></head><body><div class='box'><div class='top'><strong>⚡ WaitMax Mobile</strong><span class='coins' id='wc'>0 WaitCoins</span></div><p class='note'>🔒 100% Private · Never Reads Your Chats · Opt-In Sponsored Companion</p><div class='ad' id='adBox'><button class='cls' id='xBtn'>✕</button><span class='tag'>SPONSORED</span><h3 id='t'>Loading AI Partner...</h3><p id='d'>Keep screen active for 10s while AI generates to earn +1 WaitCoin.</p><a class='cta' id='u' href='#' target='_blank'>Explore Partner →</a></div><div class='vault'><strong>🎁 Digital Reward Vault</strong><button class='vbtn' id='v10'>Unlock 50 Pro AI Prompts (10 WaitCoins)</button><button class='vbtn' id='v25'>Unlock Partner Discount Codes (25 WaitCoins)</button><p class='note' id='vMsg'></p></div><p class='note' id='st'>Smart 10s rotation active · Syncs every 5 views</p></div><script>const S=String.fromCharCode(47);let uid=localStorage.getItem('waitmax_uuid')||('mob_'+Math.random().toString(36).slice(2));localStorage.setItem('waitmax_uuid',uid);let coins=Number(localStorage.getItem('waitcoins')||0),pend=0,ads=[],idx=0,paused=false;const upd=()=>{document.getElementById('wc').innerText=coins+' WaitCoins';};upd();document.getElementById('xBtn').onclick=()=>{paused=true;document.getElementById('adBox').style.display='none';document.getElementById('st').innerText='Paused by user. Refresh to resume.';};document.getElementById('v10').onclick=()=>{if(coins<10){document.getElementById('vMsg').innerText='Need 10 WaitCoins to unlock!';return;}coins-=10;localStorage.setItem('waitcoins',coins);upd();document.getElementById('vMsg').innerText='Unlocked! Code: WAITMAX50PRO';};document.getElementById('v25').onclick=()=>{if(coins<25){document.getElementById('vMsg').innerText='Need 25 WaitCoins to unlock!';return;}coins-=25;localStorage.setItem('waitcoins',coins);upd();document.getElementById('vMsg').innerText='Unlocked! Partner VIP Code: WAITMAXVIP25';};async function load(){try{const r=await fetch(S+'api'+S+'ads');ads=await r.json();show();}catch(e){}}function show(){if(paused||!ads.length)return;const a=ads[idx%ads.length];document.getElementById('t').innerText=a.title;document.getElementById('d').innerText=a.description;document.getElementById('u').href=a.ctaUrl;idx++;if(!document.hidden){coins++;pend++;localStorage.setItem('waitcoins',coins);upd();if(pend>=5){pend=0;fetch(S+'api'+S+'click',{method:'POST',headers:{'Content-Type':'application'+S+'json'},body:JSON.stringify({user_uuid:uid,event_type:'batch_sync',batch_count:5})}).catch(()=>{});}}}load();setInterval(show,10000);</script></body></html>
