<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaitMax AI — 10 WaitCoins Pro Prompt Vault</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #070b14; color: #f8fafc; margin: 0; padding: 20px; line-height: 1.6; }
  .box { max-width: 780px; margin: 0 auto; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 28px; }
  .badge { display: inline-block; background: #10b98120; color: #34d399; border: 1px solid #10b98155; padding: 5px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  h1 { margin: 14px 0 6px; font-size: 26px; color: #fff; }
  .sub { color: #94a3b8; margin-bottom: 16px; font-size: 15px; }
  .search { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #334155; background: #090d16; color: #fff; font-size: 14px; margin-bottom: 20px; outline: none; }
  .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 14px; border-left: 4px solid #3b82f6; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
  .top strong { color: #93c5fd; font-size: 15px; }
  .copy-btn { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  code { display: block; background: #090d16; padding: 12px; border-radius: 8px; font-size: 13px; color: #e2e8f0; white-space: pre-wrap; border: 1px solid #334155; }
  .var { color: #fbbf24; font-weight: 700; }
  .lock { text-align: center; padding: 48px 20px; }
  .lock h2 { color: #f87171; }
  .cta { display: inline-block; margin-top: 16px; background: #10b981; color: #052e16; padding: 12px 22px; border-radius: 10px; font-weight: 700; text-decoration: none; }
  .footer { margin-top: 26px; font-size: 13px; color: #64748b; text-align: center; border-top: 1px solid #1e293b; padding-top: 16px; }
</style>
</head>
<body>
<div class="box" id="app"></div>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const localCoins = parseInt(localStorage.getItem("waitcoins") || "0", 10);
  const unlocked = params.get("unlocked") === "1" || localCoins >= 10 || document.referrer.indexOf("waitmax") !== -1;
  const root = document.getElementById("app");
  if (!unlocked) {
    root.innerHTML = '<div class="lock"><span class="badge">🔒 VAULT LOCKED · 10 WAITCOINS REQUIRED</span><h2>Earn 10 WaitCoins to Unlock This Vault</h2><p>Run WaitMax AI alongside ChatGPT, Gemini, Claude, or Sora while waiting for AI responses.</p><a class="cta" href="/">Launch WaitMax AI →</a></div>';
    return;
  }
  const prompts = [
    { t: "1. Micro-SaaS Idea Validator", b: "Act as a SaaS product strategist. Analyze [IDEA] for target audience, top 3 painful problems solved, pricing tiers, and 7-day MVP launch plan." },
    { t: "2. Zero-Fluff Code Debugger", b: "Find the root cause of this bug, explain why it happens in 2 lines, and provide clean production-ready code without placeholders: [PASTE CODE]" },
    { t: "3. Viral Short-Form Script Hook", b: "Write 5 scroll-stopping 3-second hooks for a YouTube Short about [TOPIC] using curiosity gaps and clear numbers." },
    { t: "4. Cold Outreach Email (B2B Sponsors)", b: "Write a 60-word plain-text email pitching [PRODUCT] to an AI founder. Focus strictly on ROI, zero buzzwords, and 1 clear CTA." },
    { t: "5. Deep Concept Simplifier", b: "Explain [COMPLEX TOPIC] like I am a smart 16-year-old builder using a real-world analogy and 3 bullet takeaways." },
    { t: "6. Full-Stack UI Prompt (v0 / Bolt / Lovable)", b: "Build a dark-mode responsive dashboard UI with Tailwind CSS featuring a top stats bar, filterable table, and clean empty states for [APP]." },
    { t: "7. Video Generation Director (Sora / Runway / Kling)", b: "Cinematic tracking shot of [SUBJECT], golden hour volumetric lighting, 35mm lens, shallow depth of field, photorealistic 4k, smooth camera motion." },
    { t: "8. Landing Page Copy Optimizer", b: "Rewrite this hero headline and subheadline to boost conversion rate by focusing on the user outcome instead of features: [COPY]" },
    { t: "9. SQL & Database Index Auditor", b: "Review this PostgreSQL schema and suggest exact indexes to keep queries under 20ms at 100k rows: [SCHEMA]" },
    { t: "10. Daily Execution Planner", b: "Turn these messy tasks into a 3-block priority schedule based on highest revenue impact first: [TASKS]" }
  ];
  let html = '<span class="badge">✅ UNLOCKED · 10 WAITCOINS DIGITAL VAULT</span><h1>⚡ Pro AI Prompts Pack (Master Edition)</h1><p class="sub">Click Copy on any prompt and paste directly into ChatGPT, Claude, Gemini, or DeepSeek.</p>';
  html += '<input class="search" type="text" placeholder="🔍 Filter prompts by keyword..." oninput="flt(this.value)"><div id="list">';
  prompts.forEach(function(item, idx) {
    const formatted = item.b.replace(/\[(.*?)\]/g, '<span class="var">[$1]</span>');
    html += '<div class="card" data-q="' + (item.t + " " + item.b).toLowerCase() + '"><div class="top"><strong>' + item.t + '</strong><button class="copy-btn" onclick="cp(' + idx + ', this)">⚡ Copy Prompt</button></div><code>' + formatted + '</code></div>';
  });
  html += '</div><div class="footer">🔒 100% Private · Never Reads Your Chats · WaitMax AI Digital Rewards</div>';
  root.innerHTML = html;
  window.flt = function(q) {
    const term = q.toLowerCase().trim();
    document.querySelectorAll(".card").forEach(function(card) {
      card.style.display = card.getAttribute("data-q").indexOf(term) !== -1 ? "block" : "none";
    });
  };
  window.cp = function(idx, btn) {
    const txt = prompts.at(idx).b;
    if (navigator.clipboard) { navigator.clipboard.writeText(txt); }
    btn.innerText = "✅ Copied!";
    setTimeout(function() { btn.innerText = "⚡ Copy Prompt"; }, 1800);
  };
})();
</script>
</body>
</html>
